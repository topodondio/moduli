# Crea l'installer di Windows e lo pubblica come release.
# Parte da solo quando su main cambia la versione in fascicolo/__init__.py (se la release
# vX.Y.Z non esiste ancora), oppure a mano da Actions › "Installer Windows" › Run workflow.
# Il programma trova le release da menu ? › Controlla aggiornamenti.
name: Installer Windows

on:
  push:
    branches: [main]
    paths: ["fascicolo/__init__.py", ".github/workflows/release.yml", "installer/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path fascicolo/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "esiste=1" >> $env:GITHUB_OUTPUT; Write-Host "La release v$v esiste già: niente da fare" }
          else { "esiste=0" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.esiste == '0'
        with:
          python-version: "3.12"

      - name: Librerie
        if: steps.ver.outputs.esiste == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Programma (PyInstaller)
        if: steps.ver.outputs.esiste == '0'
        run: >
          pyinstaller --noconfirm --windowed --name Fascicolo
          --icon assets/fascicolo.ico
          --add-data "moduli;moduli" --add-data "mappature;mappature" --add-data "assets;assets"
          Fascicolo.pyw

      - name: Installer (Inno Setup)
        if: steps.ver.outputs.esiste == '0'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} installer\Fascicolo.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pubblica la release
        if: steps.ver.outputs.esiste == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Fascicolo ${{ steps.ver.outputs.version }}
          files: dist/Fascicolo-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true

      - name: Installer come artifact
        if: steps.ver.outputs.esiste == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Fascicolo-Setup-${{ steps.ver.outputs.version }}
          path: dist/Fascicolo-Setup-*.exe
