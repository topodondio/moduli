# Crea l'installer di Windows e lo pubblica come release.
# Parte da solo quando su main cambia la versione in fascicolo/__init__.py (se la release
# vX.Y.Z non esiste ancora), oppure a mano da Actions › "Installer Windows" › Run workflow.
# L'installer si può creare anche senza GitHub:  python installer/crea_installer.py
name: Installer Windows

on:
  push:
    branches: [main]
    paths: ["fascicolo/__init__.py", ".github/workflows/release.yml", "installer/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: ver
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' fascicolo/__init__.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "esiste=1" >> "$GITHUB_OUTPUT"; echo "La release v$v esiste già: niente da fare"
          else
            echo "esiste=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.esiste == '0'
        with:
          python-version: "3.12"

      - name: Installer
        if: steps.ver.outputs.esiste == '0'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          python installer/crea_installer.py

      - name: Pubblica la release
        if: steps.ver.outputs.esiste == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Modulo ${{ steps.ver.outputs.version }}
          files: dist/Modulo-Setup-${{ steps.ver.outputs.version }}.exe
          generate_release_notes: true
